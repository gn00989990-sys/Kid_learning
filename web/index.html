<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>語言學習</title>
    <style>
        /* Global Styles & Background */
        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-image: url("BG/BG.png");
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* Return buttons */
        .return-btn {
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            right: max(12px, env(safe-area-inset-right));
            padding: 10px 16px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            background-color: #ff5722;
            color: #ffffff;
            cursor: pointer;
            z-index: 10;
            min-height: 44px;
            min-width: 44px;
        }

        /* Pages styling */
        .page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
            padding: 60px 20px 40px 20px;
        }

        .home-button, .topic-button, .dialogue-button, .audio-control-btn {
            padding: 20px 40px;
            font-size: 24px;
            border: none;
            border-radius: 10px;
            background-color: #4CAF50;
            color: #ffffff;
            cursor: pointer;
            margin: 10px;
        }

        .home-button {
            padding: 0;
            border: none;
            border-radius: 0;
            background: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            appearance: none;
            -webkit-appearance: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: transform 0.12s ease;
        }

        .home-button:active {
            animation: homeButtonShake 0.18s ease-in-out;
        }

        @keyframes homeButtonShake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            50% { transform: translateX(2px); }
            75% { transform: translateX(-1px); }
            100% { transform: translateX(0); }
        }

        .home-button img {
            display: block;
            width: min(240px, 80vw);
            max-width: 240px;
            height: auto;
            pointer-events: none;
        }

        .home-button:hover,
        .home-button:focus,
        .home-button:active {
            transform: none;
            background: transparent;
            outline: none;
            box-shadow: none;
            filter: none;
        }

        .audio-control-btn {
            padding: 10px 20px;
            font-size: 18px;
        }
        #stop-btn { background-color: #f44336; }


        #home-page .home-subtitle {
            font-size: 18px;
            color: #555;
            margin-bottom: 10px;
        }

        .home-title-image {
            width: min(240px, 74vw);
            max-width: 240px;
            height: auto;
            margin-bottom: 2px;
        }

        .home-subtitle-image {
            width: min(300px, 84vw);
            max-width: 300px;
            height: auto;
            margin-bottom: 8px;
        }

        .page-header-image {
            width: min(320px, 86vw);
            max-width: 320px;
            height: auto;
            margin-bottom: 10px;
        }

        /* ============= 小測驗模式頁 - 可愛小提示徽章 ============= */
        .quiz-mode-intro {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #fff6da, #ffe6b3);
            border: 2px dashed #f5a742;
            border-radius: 999px;
            padding: 10px 22px;
            margin: 2px 0 22px 0;
            max-width: 90vw;
            box-shadow: 0 6px 14px rgba(230, 126, 34, 0.18);
            font-size: 14.5px;
            font-weight: 700;
            color: #b3690f;
            line-height: 1.5;
            text-align: center;
            animation: quizIntroPop 0.4s ease;
        }
        .quiz-mode-intro-icon {
            font-size: 20px;
            flex-shrink: 0;
        }
        @keyframes quizIntroPop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ============= 小測驗 - 模式選擇卡 (與 vocab-item 卡片風格一致) ============= */
        .quiz-mode-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 520px;
            margin-top: 20px;
        }
        .quiz-mode-card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 16px;
            padding: 24px 20px;
            width: 190px;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.06);
            transition: transform 0.2s;
        }
        .quiz-mode-card:hover { transform: translateY(-5px); }
        .quiz-mode-emoji { font-size: 48px; margin-bottom: 10px; line-height: 1; }
        .quiz-mode-label { font-size: 20px; font-weight: 700; color: #333; margin-bottom: 6px; }
        .quiz-mode-sub { font-size: 13px; color: #888; }

        .quiz-audio-replay-btn {
            padding: 10px 22px;
            border: none;
            border-radius: 50px;
            background-color: #3498db;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin: 0 0 14px 0;
        }

        .quiz-launch-btn {
            padding: 14px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff6b6b, #ee5253);
            color: #fff;
            cursor: pointer;
            margin: 6px 0 20px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            font-weight: 700;
        }
        .quiz-launch-btn:active { transform: scale(0.97); }

        /* Grid for 20 Vocab Items */
        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            margin-top: 20px;
        }

        .vocab-item {
            background: rgba(255, 255, 255, 0.96);
            padding: 22px 18px;
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .vocab-item:hover {
            transform: translateY(-5px);
        }

        .vocab-item p { margin: 4px 0; }

        /* Prettier Speak Button Group inside Vocab Card */
        .speak-btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            margin-top: 15px;
        }

        .vocab-speak-btn {
            padding: 8px 14px;
            color: white;
            border: none;
            border-radius: 50px; /* Fully Rounded / Capsule Shape */
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        .vocab-speak-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 10px rgba(0,0,0,0.15);
        }
        .vocab-speak-btn:active {
            transform: scale(0.98);
        }

        /* Refined colors for buttons */
        .btn-all { background: linear-gradient(135deg, #f1c40f, #f39c12); color: #333 !important; }
        .btn-en { background: linear-gradient(135deg, #3498db, #2980b9); }
        .btn-pnh { background: linear-gradient(135deg, #e67e22, #d35400); }
        .btn-canton { background: linear-gradient(135deg, #9b59b6, #8e44ad); }

        .dialogue-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            text-align: left;
            margin-bottom: 20px;
            font-size: 20px;
            line-height: 1.8;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
            max-height: 42vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            box-sizing: border-box;
        }

        /* Wrapper that holds the picture + script together so the picture
           stays put while the script area scrolls on its own */
        .dialogue-content-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .dialogue-detail-img {
            display: none;
            max-width: 520px;
            width: 95%;
            max-height: 30vh;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.12);
            margin-bottom: 18px;
            position: sticky;
            top: 6px;
            flex-shrink: 0;
        }

        /* ===================== DIALOGUE TOPIC PICTURE CARDS ===================== */
        #dialogue-topics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 18px;
            max-width: 960px;
            width: 100%;
            margin-top: 10px;
        }

        .dialogue-topic-card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 18px;
            padding: 14px;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }
        .dialogue-topic-card:hover { transform: translateY(-5px); }
        .dialogue-topic-card:active { transform: scale(0.97); }

        .dialogue-thumb {
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 14px;
            overflow: hidden;
            background: linear-gradient(135deg, #a8e6cf, #dcedc1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
            line-height: 1;
            margin-bottom: 12px;
        }
        .dialogue-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .dialogue-topic-label {
            font-size: 16px;
            font-weight: 700;
            color: #333;
            line-height: 1.3;
        }

        /* ===================== SENTENCE-BY-SENTENCE PRACTICE LIST ===================== */
        .dialogue-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 4px;
            border-bottom: 1px solid rgba(0,0,0,0.07);
        }
        .dialogue-line:last-child { border-bottom: none; }

        .dialogue-line-text { flex: 1; }

        .dialogue-line-btn {
            flex-shrink: 0;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(135deg, #3498db, #2980b9);
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: transform 0.15s ease;
        }
        .dialogue-line-btn:hover { transform: scale(1.08); }
        .dialogue-line-btn:active { transform: scale(0.95); }

        .dialogue-line.speaking {
            background: #fff3cd;
            border-radius: 10px;
            box-shadow: inset 0 0 0 2px #f39c12;
            transform: scale(1.02);
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* ===================== STEP-BY-STEP PRACTICE MODE ===================== */
        .mode-btn-active {
            outline: 3px solid #f39c12;
            outline-offset: 2px;
        }

        .step-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            padding: 10px 4px 4px;
        }

        .step-progress-label {
            font-size: 15px;
            font-weight: 700;
            color: #888;
        }

        .step-progress-bar {
            width: 100%;
            height: 10px;
            border-radius: 6px;
            background: #eee;
            overflow: hidden;
        }
        .step-progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border-radius: 6px;
            transition: width 0.25s ease;
        }

        .step-sentence-text {
            font-size: 26px;
            font-weight: 700;
            color: #333;
            line-height: 1.5;
        }

        .step-big-play-btn {
            border: none;
            width: 78px;
            height: 78px;
            border-radius: 50%;
            font-size: 32px;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(135deg, #3498db, #2980b9);
            box-shadow: 0 6px 12px rgba(0,0,0,0.18);
            transition: transform 0.15s ease;
        }
        .step-big-play-btn:hover { transform: scale(1.06); }
        .step-big-play-btn:active { transform: scale(0.95); }

        .step-complete {
            font-size: 22px;
            font-weight: 700;
            color: #27ae60;
        }

        #step-nav-controls {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .step-progress-text {
            font-size: 16px;
            font-weight: 700;
            color: #555;
            min-width: 60px;
            text-align: center;
        }

        #step-prev-btn:disabled, #step-next-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===================== QUIZ STYLES ===================== */
        .quiz-card {
            background: rgba(255,255,255,0.97);
            border-radius: 22px;
            max-width: 480px;
            width: 100%;
            padding: 30px 24px 26px 24px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.12);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .quiz-progress {
            font-size: 16px;
            font-weight: 700;
            color: #666;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .quiz-progress-bar-track {
            width: 100%;
            height: 10px;
            background: #eee;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .quiz-progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            border-radius: 6px;
            transition: width 0.3s ease;
        }

        .quiz-emoji {
            font-size: 72px;
            line-height: 1;
            margin: 4px 0 16px 0;
        }

        .quiz-question-text {
            font-size: 26px;
            font-weight: 800;
            color: #333;
            margin: 4px 0 22px 0;
        }

        .quiz-question-sub {
            font-size: 14px;
            color: #888;
            margin-top: -6px;
            margin-bottom: 18px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
        }

        .quiz-option-btn {
            padding: 16px 18px;
            font-size: 18px;
            font-weight: 600;
            border: 2px solid #ddd;
            border-radius: 14px;
            background: #fafafa;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.15s ease;
        }
        .quiz-option-btn:active { transform: scale(0.98); }
        .quiz-option-btn.correct {
            background: #e8f8ee;
            border-color: #4CAF50;
            color: #2e7d32;
        }
        .quiz-option-btn.wrong {
            background: #fdeaea;
            border-color: #f44336;
            color: #c62828;
        }
        .quiz-option-btn.disabled {
            pointer-events: none;
            opacity: 0.55;
        }
        .quiz-mark {
            font-size: 20px;
            margin-left: 10px;
        }

        .quiz-nav-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .quiz-nav-btn {
            flex: 1;
            padding: 12px 10px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: #607d8b;
            color: #fff;
        }
        .quiz-nav-btn.next-btn { background: #4CAF50; }
        .quiz-nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .quiz-result-emoji {
            font-size: 90px;
            line-height: 1;
            margin-bottom: 10px;
        }
        .quiz-result-title {
            font-size: 28px;
            font-weight: 800;
            color: #333;
            margin-bottom: 8px;
        }
        .quiz-result-score {
            font-size: 22px;
            color: #555;
            margin-bottom: 20px;
        }
        .quiz-sticker {
            font-size: 56px;
            margin: 10px 0 20px 0;
            animation: pop-sticker 0.6s ease;
        }
        @keyframes pop-sticker {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); }
        }
        .quiz-result-btns {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .quiz-result-btn {
            padding: 12px 22px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: #fff;
            background: #4CAF50;
        }
        .quiz-result-btn.secondary { background: #607d8b; }

        @keyframes tick-pop {
            0% { transform: scale(0); }
            60% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .tick-anim { animation: tick-pop 0.35s ease; display: inline-block; }

        /* ===================== MOBILE RESPONSIVE ADJUSTMENTS ===================== */
        @media (max-width: 600px) {
            .page {
                padding: 56px 14px 30px 14px;
            }
            h1 {
                font-size: 22px;
                line-height: 1.3;
                margin: 0 0 10px 0;
                padding: 0 40px;
                word-break: break-word;
            }
            #home-page h1 { padding: 0; }

            .return-btn {
                top: max(8px, env(safe-area-inset-top));
                right: max(8px, env(safe-area-inset-right));
                padding: 6px 10px;
                font-size: 12px;
                border-radius: 6px;
                line-height: 1.4;
            }

            #home-page .home-subtitle {
                font-size: 14px;
                padding: 0 10px;
            }

            .home-button, .topic-button, .dialogue-button {
                padding: 14px 20px;
                font-size: 17px;
                width: 100%;
                max-width: 300px;
                box-sizing: border-box;
                margin: 6px 0;
            }

            .audio-control-btn {
                padding: 9px 14px;
                font-size: 14px;
            }

            #dialogue-controls { gap: 8px; }

            .quiz-mode-intro { font-size: 12.5px; padding: 9px 16px; gap: 6px; }
            .quiz-mode-intro-icon { font-size: 17px; }
            .quiz-mode-grid { gap: 14px; max-width: 340px; }
            .quiz-mode-card { width: 145px; padding: 18px 12px; border-radius: 14px; }
            .quiz-mode-emoji { font-size: 38px; margin-bottom: 6px; }
            .quiz-mode-label { font-size: 16px; }
            .quiz-mode-sub { font-size: 11px; }

            .vocab-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .vocab-item { padding: 16px 10px; }
            .vocab-item p { font-size: 14px; }

            #dialogue-topics {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .dialogue-thumb { font-size: 32px; margin-bottom: 8px; }
            .dialogue-topic-label { font-size: 13px; }

            .dialogue-box {
                padding: 16px;
                font-size: 16px;
                line-height: 1.6;
                max-height: 34vh;
            }

            .dialogue-detail-img {
                max-height: 24vh;
                margin-bottom: 10px;
            }

            .dialogue-line { padding: 10px 2px; gap: 8px; }
            .dialogue-line-btn { width: 36px; height: 36px; font-size: 15px; }

            .step-sentence-text { font-size: 19px; }
            .step-big-play-btn { width: 64px; height: 64px; font-size: 26px; }
            .step-progress-text, .step-progress-label { font-size: 13px; }

            .quiz-card {
                padding: 20px 16px 18px;
                border-radius: 16px;
                max-width: 100%;
            }
            .quiz-emoji { font-size: 48px; margin: 2px 0 14px 0; }
            .quiz-question-text { font-size: 20px; margin: 4px 0 16px 0; }
            .quiz-question-sub { font-size: 12px; margin-top: -4px; margin-bottom: 14px; }
            .quiz-option-btn { padding: 12px 14px; font-size: 15px; }
            .quiz-nav-btn { font-size: 14px; padding: 10px 8px; }
            .quiz-audio-replay-btn { margin: 0 0 12px 0; }

            .quiz-result-emoji { font-size: 64px; }
            .quiz-result-title { font-size: 22px; }
            .quiz-result-score { font-size: 17px; }
            .quiz-sticker { font-size: 42px; }
            .quiz-result-btn { padding: 10px 16px; font-size: 14px; }
        }

        @media (max-width: 360px) {
            .vocab-grid { grid-template-columns: 1fr; }
            #dialogue-topics { grid-template-columns: 1fr 1fr; }
            .quiz-mode-card { width: 130px; }
            h1 { font-size: 19px; }
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <!-- 1. Home Page -->
    <div id="home-page" class="page">
        <img src="BG/kid_learning.PNG" alt="語言學習" class="home-title-image">
        <button class="home-button" id="vocab-btn">
            <img src="BG/vocab_button.PNG" alt="挑戰生字">
        </button>
        <button class="home-button" id="dialogue-btn">
            <img src="BG/speaking_button.PNG" alt="開口講英文">
        </button>
        <button class="home-button" id="mix-quiz-btn">
            <img src="BG/quiz_time_button.PNG" alt="小測驗">
        </button>
    </div>

    <!-- 2. Topic Selection Page -->

// 頁面控制
// 用嚟令逐句朗讀迴圈喺切換主題/按停止時即刻失效
let dialoguePlayToken = 0;

// 逐句練習 (Step-by-Step Practice) 相關狀態
let dialogueViewMode = 'list';       // 'list' = 全部句子一齊顯示 / 'step' = 一次淨係顯示一句
let dialogueStepIndex = 0;           // 目前練習緊第幾句 (0-based)
let currentDialogueSentences = [];   // 已拆好句嘅陣列，畀 list / step 兩個 view 共用
let currentDialogueTopic = null;     // 目前呢個主題嘅完整資料 (dialogue 陣列入面嗰粒 object)

function showPage(pageId) {
    document.getElementById('home-page').style.display = 'none';
    document.getElementById('vocab-topics-page').style.display = 'none';
    document.getElementById('vocab-display-page').style.display = 'none';
    document.getElementById('dialogue-page').style.display = 'none';
    document.getElementById('dialogue-detail-page').style.display = 'none';
    document.getElementById('quiz-page').style.display = 'none';
    document.getElementById('quiz-mode-page').style.display = 'none';
    document.getElementById('mixed-quiz-page').style.display = 'none';

    document.getElementById(pageId).style.display = 'flex';

    // 普通話提示掣淨係喺生字 (vocabulary) 頁面先顯示
    let helpBtn = document.getElementById('mandarin-help-btn');
    if (helpBtn) helpBtn.style.display = (pageId === 'vocab-display-page') ? 'block' : 'none';

    // 離開頁面時自動停止發音
    stopSpeaking();
    dialoguePlayToken++;
}

// 主選單點擊

// 產生對話主題嘅圖卡 (根據 dialogue 陣列自動生成，包含圖片同標題)
// 每個主題一張卡：有圖就顯示圖片，冇圖 (或圖片載入失敗) 就用 emoji 代替
function renderDialogueTopics() {
  let container = document.getElementById('dialogue-topics');
  container.innerHTML = '';

  dialogue.forEach((d) => {
    // 標題開頭係 emoji，之後先係文字，例如 '🍽️ Breakfast Time'
    let firstSpace = d.title.indexOf(' ');
    let emoji = firstSpace > -1 ? d.title.slice(0, firstSpace) : '💬';
    let labelText = firstSpace > -1 ? d.title.slice(firstSpace + 1) : d.title;

    let card = document.createElement('button');
    card.type = 'button';
    card.className = 'dialogue-topic-card';
    card.id = d.id;

    let thumb = document.createElement('div');
    thumb.className = 'dialogue-thumb';

    if (d.coverImage) {
      let img = document.createElement('img');
      img.src = d.coverImage;
      img.alt = labelText;
      // 圖片未加入 / 載入失敗時，改用 emoji 佔位，唔會出現破圖 icon
      img.onerror = () => {
        thumb.innerHTML = '';
        thumb.innerText = emoji;
      };
      thumb.appendChild(img);
    } else {
      thumb.innerText = emoji;
    }

    let label = document.createElement('div');
    label.className = 'dialogue-topic-label';
    label.innerText = d.title;

    card.appendChild(thumb);
    card.appendChild(label);

    card.addEventListener('click', () => {
      stopSpeaking(); // 切換主題時，停止正在播放嘅語音
      dialoguePlayToken++;
      showPage('dialogue-detail-page');
      displayDialogueScript(d.id);
    });

    container.appendChild(card);
  });
}

renderDialogueTopics();

/* ---------- 語音角色設定 ----------
   Alice = 5 歲女孩、Bob = 5 歲男孩、Server = 成人男聲 (餐廳侍應)
   小朋友嘅聲線特徵係音調較高、語速偏快，所以除咗揀選合適嘅底層聲線之外，
   仲會用 pitch/rate 微調，模擬童聲效果。 */
let preferredMaleVoice = null;      // 成人男聲 (Server 用)
let preferredMaleVoiceAlt = null;   // 第二把成人男聲 (Server 冇專屬男聲時嘅後備)
let preferredFemaleVoice = null;    // 底層女聲 (Alice 用，再加高音調扮童聲)
let preferredBoyishVoice = null;    // 底層男聲 (Bob 用，再加高音調扮童聲)
let preferredChildVoice = null;     // 裝置若有真正嘅童聲/角色聲，優先使用

// 普通話 (Mandarin) / 廣東話 (Cantonese) 聲線
let preferredMandarinVoice = null;
let preferredCantoneseVoice = null;

// Capacitor 原生 TTS 插件嘅聲線索引 (手機上用呢套，因為插件唔接受完整 voice 物件，
// 只接受 getSupportedVoices() 陣列入面嘅索引數字)
let capMaleVoiceIndex = null;
let capMaleVoiceAltIndex = null;
let capFemaleVoiceIndex = null;
let capMandarinVoiceIndex = null;
let capCantoneseVoiceIndex = null;
let capMandarinVoiceLang = null;   // 裝置實際回報嘅普通話語言標籤 (例如可能係 'cmn-CN' 而唔係 'zh-CN')
let capCantoneseVoiceLang = null;  // 裝置實際回報嘅廣東話語言標籤 (例如可能係 'yue-HK' 而唔係 'zh-HK')

async function loadCapacitorVoices() {
    const ttsPlugin = getCapacitorTTSPlugin();
    if (!ttsPlugin || typeof ttsPlugin.getSupportedVoices !== 'function') return;
    try {
        const result = await ttsPlugin.getSupportedVoices();
        const voices = (result && result.voices) || [];

        let maleNamePattern = /(daniel|fred|alex|david|mark|tom|thomas|james|george|guy|ryan|aaron|liam|oliver|arthur|male)/i;
        let femaleNamePattern = /(samantha|zoe|zira|susan|karen|moira|tessa|fiona|kate|ava|serena|jenny|aria|emma|libby|maisie|sonia|olivia|female)/i;

        let enVoicesIdx = [];
        voices.forEach((v, i) => {
            if (v.lang && v.lang.toLowerCase().indexOf('en') === 0) enVoicesIdx.push(i);
        });

        let maleIdx = enVoicesIdx.filter(i => maleNamePattern.test(voices[i].name) && !/female/i.test(voices[i].name));
        capMaleVoiceIndex = (typeof maleIdx[0] === 'number') ? maleIdx[0] : (enVoicesIdx[0] ?? null);
        capMaleVoiceAltIndex = (typeof maleIdx[1] === 'number') ? maleIdx[1] : capMaleVoiceIndex;

        let femaleIdx = enVoicesIdx.filter(i => femaleNamePattern.test(voices[i].name));
        capFemaleVoiceIndex = (typeof femaleIdx[0] === 'number') ? femaleIdx[0] : (enVoicesIdx[1] ?? enVoicesIdx[0] ?? null);

        // 普通話：先揀 lang 開頭係 'zh-cn' 嘅聲，搵唔到先試 'cmn' (ISO 語言代碼) 或單純 'zh'
        let cnIdx = [];
        voices.forEach((v, i) => {
            if (v.lang && v.lang.toLowerCase().indexOf('zh-cn') === 0) cnIdx.push(i);
        });
        if (cnIdx.length === 0) {
            voices.forEach((v, i) => {
                if (v.lang && v.lang.toLowerCase().indexOf('cmn') === 0) cnIdx.push(i);
            });
        }
        if (cnIdx.length === 0) {
            voices.forEach((v, i) => {
                if (v.lang && v.lang.toLowerCase() === 'zh') cnIdx.push(i);
            });
        }
        capMandarinVoiceIndex = (typeof cnIdx[0] === 'number') ? cnIdx[0] : null;
        capMandarinVoiceLang = (capMandarinVoiceIndex !== null) ? voices[capMandarinVoiceIndex].lang : null;

        // 廣東話：先揀 'zh-hk'，搵唔到就試 'yue' (廣東話嘅 ISO 語言代碼)
        let hkIdx = [];
        voices.forEach((v, i) => {
            if (v.lang && v.lang.toLowerCase().indexOf('zh-hk') === 0) hkIdx.push(i);
        });
        if (hkIdx.length === 0) {
            voices.forEach((v, i) => {
                if (v.lang && v.lang.toLowerCase().indexOf('yue') === 0) hkIdx.push(i);
            });
        }
        capCantoneseVoiceIndex = (typeof hkIdx[0] === 'number') ? hkIdx[0] : null;
        capCantoneseVoiceLang = (capCantoneseVoiceIndex !== null) ? voices[capCantoneseVoiceIndex].lang : null;

        console.log('[TTS] Mandarin tag on this device:', capMandarinVoiceLang, '| Cantonese tag:', capCantoneseVoiceLang);
    } catch (e) {
        console.warn('loadCapacitorVoices failed', e);
    }
}
loadCapacitorVoices();

function loadDialogueVoices() {
    let voices = window.speechSynthesis.getVoices() || [];
    let enVoices = voices.filter(v => v.lang && v.lang.toLowerCase().indexOf('en') === 0);

    // 裝置若內建童聲/角色聲 (例如 macOS/Safari 嘅 "Junior")，優先揀嚟做細路聲
    let childNamePattern = /(junior|child|kid|superstar)/i;
    preferredChildVoice = enVoices.find(v => childNamePattern.test(v.name)) || null;

    // 收集所有偵測到嘅男聲候選 (依名稱關鍵字比對)，去除重複
    let maleNamePattern = /(daniel|fred|alex|david|mark|tom|thomas|james|george|guy|ryan|aaron|liam|oliver|arthur|male)/i;
    let maleCandidates = enVoices.filter(v => maleNamePattern.test(v.name) && !/female/i.test(v.name));
    let seenURI = {};
    maleCandidates = maleCandidates.filter(v => {
        if (seenURI[v.voiceURI]) return false;
        seenURI[v.voiceURI] = true;
        return true;
    });

    preferredMaleVoice = maleCandidates[0] || null;
    preferredMaleVoiceAlt = maleCandidates[1] || null;
    preferredBoyishVoice = maleCandidates[0] || null;

    // 女聲揀選：優先揀「Natural / Online / Premium / Enhanced」呢類高質素、
    // 聽落本身已經比較後生清脆嘅聲線 (Edge/Windows 呢類聲通常最似真人)，
    // 再退而求其次揀已知比較後生嘅名字，最後先用 "female" 關鍵字兜底。
    // 呢個做法可以減少要靠谷 pitch 先扮到後生聲，避免出現假聲/尖聲。
    preferredFemaleVoice =
        enVoices.find(v => /(natural|online|premium|enhanced)/i.test(v.name) && /(female|zira|jenny|aria|emma|ana|libby|maisie|sonia|olivia)/i.test(v.name))
        || enVoices.find(v => /(samantha|zoe|zira|susan|karen|moira|tessa|fiona|kate|ava|serena|jenny|aria|emma|libby|maisie|sonia|olivia)/i.test(v.name))
        || enVoices.find(v => /female/i.test(v.name))
        || enVoices.find(v => /(victoria)/i.test(v.name));

    // 普通話聲線 (zh-CN)
    let cnVoices = voices.filter(v => v.lang && v.lang.toLowerCase().indexOf('zh-cn') === 0);
    if (cnVoices.length === 0) {
        cnVoices = voices.filter(v => v.lang && v.lang.toLowerCase() === 'zh' || (v.lang && v.lang.toLowerCase().indexOf('cmn') === 0));
    }
    preferredMandarinVoice = cnVoices.find(v => /female/i.test(v.name)) || cnVoices[0] || null;

    // 廣東話聲線 (zh-HK)
    let hkVoices = voices.filter(v => v.lang && v.lang.toLowerCase().indexOf('zh-hk') === 0);
    preferredCantoneseVoice = hkVoices.find(v => /female/i.test(v.name)) || hkVoices[0] || null;
}

function isSpeechSynthesisSupported() {
    return 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function';
}

function getCapacitorTTSPlugin() {
    return window.Capacitor?.Plugins?.TextToSpeech || null;
}

function stopSpeaking() {
    const ttsPlugin = getCapacitorTTSPlugin();
    if (ttsPlugin && typeof ttsPlugin.stop === 'function') {
        ttsPlugin.stop().catch(() => {});
    }
    if (window.speechSynthesis && typeof window.speechSynthesis.cancel === 'function') {
        window.speechSynthesis.cancel();
    }
}

// 根據角色名稱取得對應聲線設定 (Alice / Bob 扮 5 歲細路聲，Server 用成人男聲)
// 呢度刻意用好細嘅 pitch/rate 調整 (最多加 10-15%)，因為將 pitch 谷得太盡
// 會令把聲變得好假、好尖 (chipmunk 效果)。反而應該優先揀一把本身已經
// 比較後生/清脆嘅底層聲線，先至加少少音調同語速，聽落先似真人細路聲。
function getSpeakerVoiceOptions(speakerName) {
    if (speakerName === 'Bob') {
        // Bob = 5 歲男孩：揀第一把男聲，音調較高、語速較快，扮童聲
        let opts = { pitch: 1.28, rate: 1.1 };
        if (preferredMaleVoice) opts.voice = preferredMaleVoice;
        if (typeof capMaleVoiceIndex === 'number') opts.capVoiceIndex = capMaleVoiceIndex;
        return opts;
    }
    if (speakerName === 'Server') {
        // Server = 餐廳成人男侍應：揀第二把男聲 (若有)，音調較低、語速較慢，聽落成熟啲
        let opts = { pitch: 0.85, rate: 0.95 };
        if (preferredMaleVoiceAlt) opts.voice = preferredMaleVoiceAlt;
        else if (preferredMaleVoice) opts.voice = preferredMaleVoice;
        if (typeof capMaleVoiceAltIndex === 'number') opts.capVoiceIndex = capMaleVoiceAltIndex;
        else if (typeof capMaleVoiceIndex === 'number') opts.capVoiceIndex = capMaleVoiceIndex;
        return opts;
    }
    // Alice 及其他角色：正常女聲，唔加誇張音調 (之前 1.15 音調喺手機原生引擎
    // 讀出嚟有啲唔自然，而家改返接近正常音調)
    let opts = { pitch: 1.0, rate: 1.0 };
    if (preferredFemaleVoice) opts.voice = preferredFemaleVoice;
    if (typeof capFemaleVoiceIndex === 'number') opts.capVoiceIndex = capFemaleVoiceIndex;
    return opts;
}

// 普通話/廣東話按鈕統一用嚟揀聲線嘅小工具
// 呢度會揀返裝置上一把「精確」符合語言嘅聲線 (例如 zh-CN 嘅 Tingting)，
// 用聲線嘅 identifier 嚟揀 (而唔淨係用 lang 字串)，希望可以避開 iOS 18
// 「Siri 語言設定覆蓋 App 要求嘅語言」呢個已知系統 bug。
function getChineseVoiceOptions(langCode) {
    if (langCode === 'zh-CN') {
        let opts = { pitch: 1 };
        if (preferredMandarinVoice) opts.voice = preferredMandarinVoice;
        if (typeof capMandarinVoiceIndex === 'number') opts.capVoiceIndex = capMandarinVoiceIndex;
        return opts;
    }
    if (langCode === 'zh-HK') {
        let opts = { pitch: 1 };
        if (preferredCantoneseVoice) opts.voice = preferredCantoneseVoice;
        if (typeof capCantoneseVoiceIndex === 'number') opts.capVoiceIndex = capCantoneseVoiceIndex;
        return opts;
    }
    return {};
}

async function speakChinese(text, langCode, callback) {
    // 淨係喺手機原生 App (唔係瀏覽器) 先會出現呢個情況，所以淨係喺有原生
    // TTS 插件嗰陣先自動顯示提示，而且成個 session 淨係自動顯示一次
    // (之後用戶隨時都可以撳「普通話提示」掣再睇一次，唔止呢一次)。
    if (langCode === 'zh-CN' && !mandarinHelpAlertShown && getCapacitorTTSPlugin()) {
        mandarinHelpAlertShown = true;
        showMandarinHelpAlert();
    }
    speakText(text, langCode, callback, getChineseVoiceOptions(langCode));
}

// 核心功能：單音播放控制函數
function speakText(text, langCode, callback, voiceOptions) {
    if (!text) {
        if (callback) callback();
        return;
    }

    const locale = langCode || 'en-US';
    const rate = (voiceOptions && typeof voiceOptions.rate === 'number') ? voiceOptions.rate : 1.0;
    const pitch = (voiceOptions && typeof voiceOptions.pitch === 'number') ? voiceOptions.pitch : 1.0;

    const ttsPlugin = getCapacitorTTSPlugin();
    if (ttsPlugin && typeof ttsPlugin.speak === 'function') {
        const speakOptions = { text, lang: locale, rate, pitch, volume: 1.0 };
        if (voiceOptions && typeof voiceOptions.capVoiceIndex === 'number') {
            speakOptions.voice = voiceOptions.capVoiceIndex;
        }
        ttsPlugin.speak(speakOptions)
            .then(() => { if (callback) callback(); })
            .catch((err) => { console.warn('Capacitor TextToSpeech failed', err); if (callback) callback(); });
        return;
    }

    if (navigator.tts && typeof navigator.tts.speak === 'function') {
        navigator.tts.speak({ text, locale, rate },
            () => { if (callback) callback(); },
            err => { console.warn('navigator.tts speak failed', err); if (callback) callback(); }
        );
        return;
    }

    if (window.plugins && window.plugins.tts && typeof window.plugins.tts.speak === 'function') {
        window.plugins.tts.speak({ text, locale, rate },
            () => { if (callback) callback(); },
            err => { console.warn('plugins.tts speak failed', err); if (callback) callback(); }
        );
        return;
    }

    if (!isSpeechSynthesisSupported()) {
        console.warn('Speech synthesis not supported in this environment', text, langCode);
        if (callback) callback();
        return;
    }

    let utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = locale;
    if (voiceOptions) {
        if (voiceOptions.voice) utterance.voice = voiceOptions.voice;
        if (typeof voiceOptions.pitch === 'number') utterance.pitch = voiceOptions.pitch;
        if (typeof voiceOptions.rate === 'number') utterance.rate = voiceOptions.rate;
    }
    if (callback) {
        utterance.onend = callback;
    }

    try {
        if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
        }
        window.speechSynthesis.speak(utterance);
    } catch (e) {
        console.warn('Web Speech speak failed', e);
        if (callback) callback();
    }
}

// 核心功能：連讀四合一（播完一個等 1 秒播下一個）
function speakAllSequence(engText, chiText, mandarinText) {
    stopSpeaking(); // 先清空目前的語音
    let mandarinChiText = mandarinText || chiText;

    // 第一步：讀英文
    speakText(engText, 'en-US', () => {
        // 英文讀完後，等待 1000 毫秒 (1秒)
        setTimeout(() => {
            // 第二步：讀普通話 (用普通話用字，例如「玉米」而唔係廣東話「粟米」)
            speakChinese(mandarinChiText, 'zh-CN', () => {
                // 普通話讀完後，再等待 1000 毫秒 (1秒)
                setTimeout(() => {
                    // 第三步：讀粵語
                    speakChinese(chiText, 'zh-HK');
                }, 1000);
            });
        }, 1000);
    });
}

// 將對話逐句拆開成陣列，每項有：原句(帶角色名)、清理過嘅句子、角色名
// list view 同 step view 都共用呢個陣列，唔使拆兩次
function parseDialogueSentences(currentDiag) {
  let rawSentences = currentDiag.script.split('<br>');
  let parsed = [];

  rawSentences.forEach((rawSentence, index) => {
      if (rawSentence.trim() === '') return;

      let speakerMatch = rawSentence.match(/^([A-Za-z]+)/);
      let speakerName = speakerMatch ? speakerMatch[1] : null;

      let cleanSentence = rawSentence
          .replace(/^[A-Za-z]+[^:]*:\s*/, '')
          .replace(/[\u2000-\u3300]|\ud83c[\ud000-\udfff]|\ud83d[\ud000-\udfff]|\ud83e[\ud000-\udfff]/g, '');

      if (cleanSentence.trim() === '') return;

      parsed.push({ index, rawSentence, cleanSentence, speakerName });
  });

  return parsed;
}

// 播放某一句 (list view 同 step view 都用呢個)，順便換返配對嘅圖
function practiceSentence(currentDiag, dialogueImage, sentenceItem) {
  stopSpeaking();
  dialoguePlayToken++; // 令連播模式失效，避免同呢句練習撞聲

  if (currentDiag.imageSegments) {
      let segment = currentDiag.imageSegments.find(s => sentenceItem.index >= s.start && sentenceItem.index <= s.end);
      if (segment) {
          dialogueImage.src = segment.image;
          dialogueImage.style.display = 'block';
      }
  }

  let voiceOptions = getSpeakerVoiceOptions(sentenceItem.speakerName);
  speakText(sentenceItem.cleanSentence, 'en-US', null, voiceOptions);
}

// 逐句練習模式：一次淨係顯示一句，配大大嘅播放掣、進度條，同 上一句/下一句 按鈕
function renderDialogueStepView(currentDiag, dialogueScript, dialogueImage, sentences, stepIndex) {
  dialogueScript.innerHTML = '';
  let stepNavControls = document.getElementById('step-nav-controls');
  let progressText = document.getElementById('step-progress-text');
  let prevBtn = document.getElementById('step-prev-btn');
  let nextBtn = document.getElementById('step-next-btn');

  if (sentences.length === 0) {
      stepNavControls.style.display = 'none';
      return;
  }

  stepNavControls.style.display = 'flex';
  let total = sentences.length;
  let item = sentences[stepIndex];

  let card = document.createElement('div');
  card.className = 'step-card';

  let progressLabel = document.createElement('div');
  progressLabel.className = 'step-progress-label';
  progressLabel.innerText = 'Sentence ' + (stepIndex + 1) + ' of ' + total;

  let progressBar = document.createElement('div');
  progressBar.className = 'step-progress-bar';
  let progressFill = document.createElement('div');
  progressFill.className = 'step-progress-fill';
  progressFill.style.width = Math.round(((stepIndex + 1) / total) * 100) + '%';
  progressBar.appendChild(progressFill);

  let sentenceText = document.createElement('div');
  sentenceText.className = 'step-sentence-text';
  sentenceText.innerHTML = item.rawSentence;

  let bigPlayBtn = document.createElement('button');
  bigPlayBtn.type = 'button';
  bigPlayBtn.className = 'step-big-play-btn';
  bigPlayBtn.innerHTML = '🔊';
  bigPlayBtn.setAttribute('aria-label', 'Practise: ' + item.cleanSentence);
  bigPlayBtn.addEventListener('click', () => practiceSentence(currentDiag, dialogueImage, item));

  card.appendChild(progressLabel);
  card.appendChild(progressBar);
  card.appendChild(sentenceText);
  card.appendChild(bigPlayBtn);
  dialogueScript.appendChild(card);

  // 更新 上一句/下一句 按鈕嘅可用狀態
  prevBtn.disabled = (stepIndex === 0);
  nextBtn.disabled = (stepIndex === total - 1);
  progressText.innerText = (stepIndex + 1) + ' / ' + total;

  // 一去到新嘅一句就自動讀出嚟 (呢個係由 Next/Previous 按鈕觸發，唔算自動播放違規)
  practiceSentence(currentDiag, dialogueImage, item);
}

  dialogueScript.innerHTML = '';

  // 切換到新主題，令舊有嘅逐句朗讀迴圈失效
  dialoguePlayToken++;

  let currentDiag = dialogue.find(d => d.id === dialogueId);
  if (currentDiag) {
      detailTitle.innerText = currentDiag.title;

      // 每次揀新主題，重置逐句練習狀態，並記低呢個主題嘅資料同拆好嘅句子

      renderCurrentDialogueView();

      // 顯示主題封面圖 (如果有設定)，冇圖就隱藏返個 <img>

          dialogueImage.src = currentDiag.coverImage;
          dialogueImage.style.display = 'block';
      } else {
          dialogueImage.removeAttribute('src');
          dialogueImage.style.display = 'none';
      }

      let playButton = document.getElementById('play-dialogue-btn');
      let newPlayButton = playButton.cloneNode(true);
      playButton.parentNode.replaceChild(newPlayButton, playButton);


      newPlayButton.addEventListener('click', () => {
          stopSpeaking(); // 先清空目前的語音
          dialoguePlayToken++; // 每次重新播放都用新 token，令之前嘅迴圈失效
          let myToken = dialoguePlayToken;

          // 自動切換去 Full List 模式，等小朋友可以睇住成段對話、跟住反白嘅句子一齊讀
          dialogueViewMode = 'list';
          dialogueStepIndex = 0;
          renderCurrentDialogueView();

          // 根據 image_3.png，使用 <br> 將整個對話切分成每一句子的陣列
          let sentences = currentDiag.script.split('<br>');
          let sentenceIndex = 0;
          let lastShownImage = null;

          // 根據目前讀緊嘅句子索引，揾返對應要顯示嘅圖片 (如果呢個主題有設定)
          function updateImageForSentence(index) {
              if (!currentDiag.imageSegments) return;
              let segment = currentDiag.imageSegments.find(s => index >= s.start && index <= s.end);
              if (segment && segment.image !== lastShownImage) {
                  dialogueImage.src = segment.image;
                  dialogueImage.style.display = 'block';
                  lastShownImage = segment.image;
              }
          }

          function readEnglishSentence() {
              // 若話題已經切換或已按停止，token 會唔同，即刻停止朗讀
              if (myToken !== dialoguePlayToken) return;

              if (sentenceIndex < sentences.length) {
                  let rawSentence = sentences[sentenceIndex];

                  // 根據目前句子更新配圖，同喺 Full List 反白目前呢句
                  updateImageForSentence(sentenceIndex);
                  highlightSpeakingLine(sentenceIndex);

                  // 先取得角色名稱 (如 Bob / Alice / Server)，再清理句子
                  let speakerMatch = rawSentence.match(/^([A-Za-z]+)/);
                  let speakerName = speakerMatch ? speakerMatch[1] : null;

                  // 清理句子：移除人名+角色 Emoji 開頭 (如 "Alice 👧: ") 以及可能干擾發音的 Emoji 符號
                  let cleanSentence = rawSentence
                      .replace(/^[A-Za-z]+[^:]*:\s*/, '') // 移除角色名與角色 Emoji
                      .replace(/[\u2000-\u3300]|\ud83c[\ud000-\udfff]|\ud83d[\ud000-\udfff]|\ud83e[\ud000-\udfff]/g, ''); // 移除其餘 Emoji

                  // 如果清理後是空行，直接跳過讀下一句
                  if (cleanSentence.trim() === '') {
                      sentenceIndex++;
                      readEnglishSentence();
                      return;
                  }

                  // 根據角色決定聲線 (Alice/Bob 扮 5 歲細路聲，Server 用成人男聲)
                  let voiceOptions = getSpeakerVoiceOptions(speakerName);

                  // 播放當前句子
                  speakText(cleanSentence, 'en-US', () => {
                      if (myToken !== dialoguePlayToken) return; // 停止或切換咗就唔再排下一句
                      setTimeout(() => {
                          if (myToken !== dialoguePlayToken) return;
                          // 等待 1 秒後讀下一句
                          sentenceIndex++;
                          readEnglishSentence();
                      }, 1000);
                  }, voiceOptions);
              } else {
                  // 讀完成個對話，清除反白，並回復顯示封面圖
                  clearSpeakingHighlight();
                  if (currentDiag.coverImage) {
                      dialogueImage.src = currentDiag.coverImage;
                      dialogueImage.style.display = 'block';
                  }
              }
          }

          // 開始執行逐句連讀
          readEnglishSentence();
      });

      let stopButton = document.getElementById('stop-btn');
      let newStopButton = stopButton.cloneNode(true);
      stopButton.parentNode.replaceChild(newStopButton, stopButton);

      newStopButton.addEventListener('click', () => {
          stopSpeaking();
          dialoguePlayToken++; // 令目前嘅朗讀迴圈失效
          clearSpeakingHighlight();
          // 按停止後回復顯示封面圖
          if (currentDiag.coverImage) {
              dialogueImage.src = currentDiag.coverImage;
              dialogueImage.style.display = 'block';
          }
      });
  }
}

/* =========================================================
   小測驗 (Quiz) 功能
   - 每個主題有 10 題題庫 (pool)
   - 每次開始測驗時隨機抽 6 題
   - 答對顯示 ✅ 及開心音效，並讀出正確答案
   - 可用「上一題」「下一題」在 6 題之間移動
   - 完成後顯示總分，滿分顯示可愛貼紙 + 慶祝音效
   ========================================================= */

let quizSession = {
    topic: null,
    questions: [],   // 6 randomly chosen questions for this session
    currentIndex: 0,
    answers: []       // parallel array: { selected, correct } or null
};

function shuffleArray(arr) {
    let a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// 建立某主題的 10 題題庫 (使用該主題前 10 個生字作為題目本體)
function buildQuizPool(topic) {
    let topicItems = vocab.filter(v => v.topic === topic).slice(0, 10);
    return topicItems.map(item => {
        let distractorPool = vocab.filter(v => v.topic === topic && v.englishName !== item.englishName);
        let distractors = shuffleArray(distractorPool).slice(0, 3).map(d => d.englishName);
        let options = shuffleArray([item.englishName, ...distractors]);
        return {
            emoji: item.emoji,
            chinese: item.chineseName,
            correct: item.englishName,
            options: options
        };
    });
}

function startQuiz(topic) {
    let pool = buildQuizPool(topic);
    let sixQuestions = shuffleArray(pool).slice(0, 6);

    quizSession = {
        topic: topic,
        questions: sixQuestions,
        currentIndex: 0,
        answers: new Array(6).fill(null)
    };

    document.getElementById('quiz-title').innerText = topic + ' 小測驗';
    document.getElementById('quiz-result-view').style.display = 'none';
    document.getElementById('quiz-question-view').style.display = 'block';

    showPage('quiz-page');
    renderQuizQuestion();
}

document.getElementById('start-quiz-btn').addEventListener('click', () => {
    if (currentTopic) startQuiz(currentTopic);
});

document.getElementById('quiz-replay-btn').addEventListener('click', () => {
    let q = quizSession.questions[quizSession.currentIndex];
    if (!q) return;
    stopSpeaking();
    speakChinese(q.chinese, 'zh-HK');
});

function exitQuiz() {
    stopSpeaking();
    if (currentTopic) {
        showPage('vocab-display-page');
    } else {
        showPage('vocab-topics-page');
    }
}

function renderQuizQuestion() {
    let idx = quizSession.currentIndex;
    let q = quizSession.questions[idx];
    let saved = quizSession.answers[idx];

    document.getElementById('quiz-progress-text').innerText = `問題 ${idx + 1}/6`;
    document.getElementById('quiz-progress-fill').style.width = (((idx + 1) / 6) * 100) + '%';
    document.getElementById('quiz-emoji').innerText = q.emoji;
    document.getElementById('quiz-question-text').innerText = q.chinese + ' 英文是？';

    // 每次顯示新題目時自動讀出生字題目 (廣東話)，方便小朋友聽住讀音作答
    stopSpeaking();
    speakChinese(q.chinese, 'zh-HK');

    let optionsContainer = document.getElementById('quiz-options');
    optionsContainer.innerHTML = '';

    q.options.forEach(optionText => {
        let btn = document.createElement('button');
        btn.classList.add('quiz-option-btn');
        btn.dataset.value = optionText;
        btn.innerHTML = `<span>${optionText}</span><span class="quiz-mark"></span>`;

        // Restore previous state if this question was already answered (single attempt only)
        if (saved) {
            if (optionText === saved.selected) {
                btn.classList.add(saved.correct ? 'correct' : 'wrong');
                btn.querySelector('.quiz-mark').innerHTML = saved.correct ? '<span class="tick-anim">✅</span>' : '❌';
            }
            // 若第一次作答錯誤，揭曉正確答案
            if (!saved.correct && optionText === q.correct) {
                btn.classList.add('correct');
                btn.querySelector('.quiz-mark').innerHTML = '<span class="tick-anim">✅</span>';
            }
            btn.classList.add('disabled');
        }

        btn.addEventListener('click', () => handleQuizAnswer(optionText, btn));
        optionsContainer.appendChild(btn);
    });

    // Nav buttons state
    document.getElementById('quiz-prev-btn').disabled = (idx === 0);
    let nextBtn = document.getElementById('quiz-next-btn');
    nextBtn.innerText = (idx === 5) ? '完成測驗 🏁' : '下一題 ➡️';
    nextBtn.disabled = false;
}

function handleQuizAnswer(optionText, btnEl) {
    let idx = quizSession.currentIndex;
    let q = quizSession.questions[idx];

    // 每題只計第一次作答，答咗就鎖定
    if (quizSession.answers[idx]) return;

    let isCorrect = (optionText === q.correct);

    if (isCorrect) {
        quizSession.answers[idx] = { selected: optionText, correct: true };
        btnEl.classList.add('correct');
        btnEl.querySelector('.quiz-mark').innerHTML = '<span class="tick-anim">✅</span>';
        playHappySound();
        // 答對後讀出正確答案 (英文生字)，等小朋友聽多次加深印象
        stopSpeaking();
        setTimeout(() => {
            speakText(q.correct, 'en-US');
        }, 300);
    } else {
        quizSession.answers[idx] = { selected: optionText, correct: false };
        btnEl.classList.add('wrong');
        btnEl.querySelector('.quiz-mark').innerHTML = '❌';

        // 第一次就答錯，呢題唔會計入總分，並揭曉正確答案
        document.querySelectorAll('#quiz-options .quiz-option-btn').forEach(b => {
            if (b.dataset.value === q.correct) {
                b.classList.add('correct');
                b.querySelector('.quiz-mark').innerHTML = '<span class="tick-anim">✅</span>';
            }
        });

        // 答錯都讀出正確答案 (英文生字)，等小朋友即刻學到啱嘅讀音
        stopSpeaking();
        setTimeout(() => {
            speakText(q.correct, 'en-US');
        }, 300);
    }

    // 作答後鎖定所有選項 (單次作答)
    document.querySelectorAll('#quiz-options .quiz-option-btn').forEach(b => b.classList.add('disabled'));
}

document.getElementById('quiz-next-btn').addEventListener('click', () => {
    if (quizSession.currentIndex === 5) {
        showQuizResult();
    } else {
        quizSession.currentIndex++;
        renderQuizQuestion();
    }
});

document.getElementById('quiz-prev-btn').addEventListener('click', () => {
    if (quizSession.currentIndex > 0) {
        quizSession.currentIndex--;
        renderQuizQuestion();
    }
});

function showQuizResult() {
    let score = quizSession.answers.filter(a => a && a.correct).length;

    document.getElementById('quiz-question-view').style.display = 'none';
    document.getElementById('quiz-result-view').style.display = 'block';
    document.getElementById('quiz-result-score').innerText = `你答對了 ${score}/6 題`;

    let fullScoreBlock = document.getElementById('quiz-full-score-sticker');
    let resultEmoji = document.getElementById('quiz-result-emoji');

    if (score === 6) {
        fullScoreBlock.style.display = 'block';
        resultEmoji.innerText = '🏆';
        playFanfareSound();
    } else {
        fullScoreBlock.style.display = 'none';
        resultEmoji.innerText = score >= 4 ? '🎉' : '💪';
    }
}

document.getElementById('quiz-retry-btn').addEventListener('click', () => {
    if (quizSession.topic) startQuiz(quizSession.topic);
});

/* ---------- 音效 (使用 Web Audio API 產生，避免依賴外部音檔，方便打包成 App) ---------- */
let audioCtx = null;
function getAudioCtx() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}

function playTone(freq, startTime, duration, ctx, gainValue) {
    let osc = ctx.createOscillator();
    let gainNode = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gainNode.gain.setValueAtTime(0.0001, startTime);
    gainNode.gain.exponentialRampToValueAtTime(gainValue || 0.25, startTime + 0.02);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gainNode);
    gainNode.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration);
}

// 開心的兩音上揚音效 (答對時)
function playHappySound() {
    try {
        let ctx = getAudioCtx();
        let now = ctx.currentTime;
        playTone(880, now, 0.14, ctx);
        playTone(1318.5, now + 0.12, 0.22, ctx);
    } catch (e) { /* audio not available */ }
}

// 滿分小號角音效 (完成測驗滿分時)
function playFanfareSound() {
    try {
        let ctx = getAudioCtx();
        let now = ctx.currentTime;
        let notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((f, i) => playTone(f, now + i * 0.15, 0.3, ctx, 0.2));
    } catch (e) { /* audio not available */ }
}

/* =========================================================
   隨機/綜合小測驗 (Mixed Quiz: 聆聽 Listening / 閱讀 Reading)
   - 題目來自所有生字主題 (全部 vocab)
   - 每次隨機抽 8 題
   - 聆聽模式：播放英文讀音 + 顯示英文文字，選項為 emoji + 英文
   - 閱讀模式：顯示英文文字並讀出英文題目，選項為 emoji + 中文，答對後讀出中文答案
   ========================================================= */

let mixedQuizSession = {
    type: null,       // 'listening' | 'reading'
    questions: [],
    currentIndex: 0,
    answers: []
};

// 取得不重複的生字池 (以英文名稱去重)
function getUniqueVocabPool() {
    let seen = {};
    let result = [];
    vocab.forEach(v => {
        if (!seen[v.englishName]) {
            seen[v.englishName] = true;
            result.push(v);
        }
    });
    return result;
}

// 建立 8 題隨機題目，每題含 1 個正確答案 + 3 個干擾項 (皆來自全部主題)
function buildMixedQuizQuestions(count) {
    let pool = getUniqueVocabPool();
    let chosen = shuffleArray(pool).slice(0, count);
    return chosen.map(target => {
        let distractorPool = pool.filter(v => v.englishName !== target.englishName);
        let distractors = shuffleArray(distractorPool).slice(0, 3);
        let optionItems = shuffleArray([target, ...distractors]);
        return { target: target, optionItems: optionItems };
    });
}

document.getElementById('mix-quiz-btn').addEventListener('click', () => showPage('quiz-mode-page'));
document.getElementById('listening-quiz-btn').addEventListener('click', () => startMixedQuiz('listening'));
document.getElementById('reading-quiz-btn').addEventListener('click', () => startMixedQuiz('reading'));

function startMixedQuiz(type) {
    let questions = buildMixedQuizQuestions(8);

    mixedQuizSession = {
        type: type,
        questions: questions,
        currentIndex: 0,
        answers: new Array(8).fill(null)
    };

    document.getElementById('mixed-quiz-title').innerText = (type === 'listening') ? 'Listening Quiz 🔊' : 'Word Matching Quiz 📖';
    document.getElementById('mixed-quiz-result-view').style.display = 'none';
    document.getElementById('mixed-quiz-question-view').style.display = 'block';

    showPage('mixed-quiz-page');
    renderMixedQuizQuestion();
}

function exitMixedQuiz() {
    stopSpeaking();
    showPage('quiz-mode-page');
}

function renderMixedQuizQuestion() {
    let idx = mixedQuizSession.currentIndex;
    let q = mixedQuizSession.questions[idx];
    let saved = mixedQuizSession.answers[idx];
    let type = mixedQuizSession.type;

    document.getElementById('mixed-quiz-progress-text').innerText = `問題 ${idx + 1}/8`;
    document.getElementById('mixed-quiz-progress-fill').style.width = (((idx + 1) / 8) * 100) + '%';

    let audioRow = document.getElementById('mixed-quiz-audio-row');
    let emojiEl = document.getElementById('mixed-quiz-emoji');
    let questionTextEl = document.getElementById('mixed-quiz-question-text');
    let subEl = document.getElementById('mixed-quiz-question-sub');
    let optionsContainer = document.getElementById('mixed-quiz-options');
    optionsContainer.innerHTML = '';

    // 聆聽同閱讀模式都會顯示「再聽一次」按鈕，方便隨時重播英文讀音
    audioRow.style.display = 'block';

    if (type === 'listening') {
        // 用耳機圖示代表「聆聽模式」，避免同下面嘅 🔊 再聽一次按鈕重疊/重複
        emojiEl.innerText = '🎧';
        questionTextEl.style.display = 'none';
        questionTextEl.innerText = '';
        subEl.innerText = '聽聽讀音，揀出啱嘅圖示';
        // 每次顯示新題目時自動播放一次英文讀音
        stopSpeaking();
        speakText(q.target.englishName, 'en-US');
    } else {
        emojiEl.innerText = '📖';
        questionTextEl.style.display = 'block';
        questionTextEl.innerText = q.target.englishName;
        subEl.innerText = '呢個英文字係咩意思？';
        // 閱讀模式都會讀出英文題目，等小朋友聽下正確讀音
        stopSpeaking();
        speakText(q.target.englishName, 'en-US');
    }

    q.optionItems.forEach(optionItem => {
        let btn = document.createElement('button');
        btn.classList.add('quiz-option-btn');
        btn.dataset.value = optionItem.englishName;
        let label = (type === 'listening')
            ? `${optionItem.emoji} ${optionItem.englishName}`
            : `${optionItem.emoji} ${optionItem.chineseName}`;
        btn.innerHTML = `<span>${label}</span><span class="quiz-mark"></span>`;

        // 還原之前作答過的狀態 (每題只計第一次作答)
        if (saved) {
            if (optionItem.englishName === saved.selectedName) {
                btn.classList.add(saved.correct ? 'correct' : 'wrong');
                btn.querySelector('.quiz-mark').innerHTML = saved.correct ? '<span class="tick-anim">✅</span>' : '❌';
            }
            // 若第一次作答錯誤，揭曉正確答案
            if (!saved.correct && optionItem.englishName === q.target.englishName) {
                btn.classList.add('correct');
                btn.querySelector('.quiz-mark').innerHTML = '<span class="tick-anim">✅</span>';
            }
            btn.classList.add('disabled');
        }

        btn.addEventListener('click', () => handleMixedQuizAnswer(optionItem, btn));
        optionsContainer.appendChild(btn);
    });

    document.getElementById('mixed-quiz-prev-btn').disabled = (idx === 0);
    let nextBtn = document.getElementById('mixed-quiz-next-btn');
    nextBtn.innerText = (idx === 7) ? '完成測驗 🏁' : '下一題 ➡️';
}

function handleMixedQuizAnswer(optionItem, btnEl) {
    let idx = mixedQuizSession.currentIndex;
    let q = mixedQuizSession.questions[idx];

    // 每題只計第一次作答，答咗就鎖定
    if (mixedQuizSession.answers[idx]) return;

    let isCorrect = (optionItem.englishName === q.target.englishName);

    if (isCorrect) {
        mixedQuizSession.answers[idx] = { selectedName: optionItem.englishName, correct: true };
        btnEl.classList.add('correct');
        btnEl.querySelector('.quiz-mark').innerHTML = '<span class="tick-anim">✅</span>';
        playHappySound();

        // 閱讀模式：答對後讀出正確嘅廣東話答案作為額外回饋
        if (mixedQuizSession.type === 'reading') {
            setTimeout(() => {
                speakChinese(q.target.chineseName, 'zh-HK');
            }, 300);
        }
    } else {
        mixedQuizSession.answers[idx] = { selectedName: optionItem.englishName, correct: false };
        btnEl.classList.add('wrong');
        btnEl.querySelector('.quiz-mark').innerHTML = '❌';

        // 第一次就答錯，呢題唔會計入總分，並揭曉正確答案
        document.querySelectorAll('#mixed-quiz-options .quiz-option-btn').forEach(b => {
            if (b.dataset.value === q.target.englishName) {
                b.classList.add('correct');
                b.querySelector('.quiz-mark').innerHTML = '<span class="tick-anim">✅</span>';
            }
        });

        // 閱讀模式：答錯都讀出正確嘅廣東話答案，等小朋友即刻學到啱嘅讀音
        if (mixedQuizSession.type === 'reading') {
            stopSpeaking();
            setTimeout(() => {
                speakChinese(q.target.chineseName, 'zh-HK');
            }, 300);
        }
    }

    // 作答後鎖定所有選項 (單次作答)
    document.querySelectorAll('#mixed-quiz-options .quiz-option-btn').forEach(b => b.classList.add('disabled'));
}

document.getElementById('mixed-quiz-replay-btn').addEventListener('click', () => {
    let q = mixedQuizSession.questions[mixedQuizSession.currentIndex];
    if (!q) return;
    stopSpeaking();
    speakText(q.target.englishName, 'en-US');
});

document.getElementById('mixed-quiz-next-btn').addEventListener('click', () => {
    if (mixedQuizSession.currentIndex === 7) {
        showMixedQuizResult();
    } else {
        mixedQuizSession.currentIndex++;
        renderMixedQuizQuestion();
    }
});

document.getElementById('mixed-quiz-prev-btn').addEventListener('click', () => {
    if (mixedQuizSession.currentIndex > 0) {
        mixedQuizSession.currentIndex--;
        renderMixedQuizQuestion();
    }
});

function showMixedQuizResult() {
    stopSpeaking();
    let score = mixedQuizSession.answers.filter(a => a && a.correct).length;

    document.getElementById('mixed-quiz-question-view').style.display = 'none';
    document.getElementById('mixed-quiz-result-view').style.display = 'block';
    document.getElementById('mixed-quiz-result-score').innerText = `你答對了 ${score}/8 題`;

    let fullScoreBlock = document.getElementById('mixed-quiz-full-score-sticker');
    let resultEmoji = document.getElementById('mixed-quiz-result-emoji');

    if (score === 8) {
        fullScoreBlock.style.display = 'block';
        resultEmoji.innerText = '🏆';
        playFanfareSound();
    } else {
        fullScoreBlock.style.display = 'none';
        resultEmoji.innerText = score >= 5 ? '🎉' : '💪';
    }
}

document.getElementById('mixed-quiz-retry-btn').addEventListener('click', () => {
    if (mixedQuizSession.type) startMixedQuiz(mixedQuizSession.type);
});
